name: Vulse demo — GitHub Pages

on:
  workflow_dispatch:
    inputs:
      demo_ref:
        description: Branch containing the demo source
        required: true
        type: choice
        default: feature/admin-spa
        options:
          - feature/admin-spa
          - main
  push:
    branches: [main]
    paths:
      - '.github/workflows/demo-pages.yml'

concurrency:
  group: vulse-demo-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.demo_ref || 'feature/admin-spa' }}
          persist-credentials: false
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vulsecms/core demo:build
      - run: test -f packages/vulse/demo/dist/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/vulse/demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy static demo
        id: deployment
        uses: actions/deploy-pages@v4
